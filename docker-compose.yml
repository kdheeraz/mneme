services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mneme-db
    environment:
      POSTGRES_USER: mneme
      POSTGRES_PASSWORD: mneme
      POSTGRES_DB: mneme
    ports:
      - "5433:5432"
    volumes:
      - mneme_db:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mneme -d mneme"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mneme-redis
    ports:
      - "6380:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mneme-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://mneme:mneme@db:5432/mneme
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEED_ON_BOOT: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      # makes "host.docker.internal" resolve to the host machine on Linux too
      # (already works on Mac/Windows by default)
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mneme-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${WEB_API_URL:-http://localhost:8000}
      API_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mneme_db:
